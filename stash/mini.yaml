# Stash Configuration — Mini（精简版，全 select 策略组）

# ==================== 锚点配置 ====================
BaseProvider: &BaseProvider
  type: http
  interval: 86400
  proxy: Proxy
  health-check:
    enable: true
    url: 'http://cp.cloudflare.com/generate_204'
    interval: 300
    timeout: 5000
    lazy: true

BaseSelect: &BaseSelect {type: select, use: [sub]}

FilterHK: &FilterHK '(?=.*(?:🇭🇰|HK|Hong))'
FilterTW: &FilterTW '(?=.*(?:🇨🇳|TW|Tai))'
FilterJP: &FilterJP '(?=.*(?:🇯🇵|JP|Japan))'
FilterSG: &FilterSG '(?=.*(?:🇸🇬|SG|Sing))'
FilterUS: &FilterUS '(?=.*(?:🇺🇸|US|USA))'
FilterDE: &FilterDE '(?=.*(?:🇩🇪|DE|DEU))'

FilterTelegram: &FilterTelegram '(?=.*(?:🇭🇰|🇯🇵|HK|JP|Hong|Japan))'
FilterGlobalMedia: &FilterGlobalMedia '(?=.*(?:🇭🇰|🇨🇳|🇸🇬|HK|TW|SG|Hong|Tai|Sing))'
FilterAIGC: &FilterAIGC '(?=.*(?:🇨🇳|🇯🇵|🇸🇬|🇺🇸|🇬🇧|TW|JP|SG|US|英国))(?=.*(?:SoftBank|Nuro|Ucom|IIJ|Starlink|ATT|Verizon|Frontier|Hawaii|家宽))'

BehaviorCL: &BehaviorCL {type: http, behavior: classical, format: text, interval: 86400}

BehaviorIP: &BehaviorIP {type: http, behavior: classical, format: text, interval: 86400}

BehaviorMrsDN: &BehaviorMrsDN {type: http, behavior: domain, format: mrs, interval: 86400}

BehaviorMrsIP: &BehaviorMrsIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# ==================== 代理提供者 ====================
proxy-providers:
  sub:
    <<: *BaseProvider
    url: '订阅地址'
    path: ./proxy_providers/sub.yaml

# ==================== 核心配置 ====================
mode: rule
port: 7890
socks-port: 7891
mixed-port: 7893
ipv6: false
allow-lan: true
log-level: warning

# ==================== 流量嗅探 ====================
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443], override-destination: true}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# ==================== DNS 配置（精简：fake-ip + 基础 nameserver）====================
dns:
  enable: true
  skip-cert-verify: true
  use-system-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.internal"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "stun.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver: [119.29.29.29, 223.5.5.5]
  nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]

# ==================== 代理策略组 ====================
proxy-groups:
  - name: Proxy
    <<: *BaseSelect
    proxies: [DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

  # ===== 地区策略 =====
  - name: HK
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    filter: *FilterHK

  - name: TW
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
    filter: *FilterTW

  - name: JP
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    filter: *FilterJP

  - name: SG
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    filter: *FilterSG

  - name: US
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    filter: *FilterUS

  - name: DE
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Germany.png
    filter: *FilterDE

  # ===== 专用策略 =====
  - name: AIGC
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    filter: *FilterAIGC

  - name: Telegram
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    filter: *FilterTelegram

  - name: GlobalMedia
    <<: *BaseSelect
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
    filter: *FilterGlobalMedia

  - name: Final
    type: select
    proxies: [Proxy, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

# ==================== 规则路由 ====================
rules:
  # ===== 域名规则 =====
  # > 自定义直连补充
  - RULE-SET,direct_extra,DIRECT
  - RULE-SET,ai,AIGC
  - RULE-SET,ai_keyword,AIGC
  - RULE-SET,stream,GlobalMedia
  - RULE-SET,stream_keyword,GlobalMedia
  - RULE-SET,telegram,Telegram
  # > 常见直连规则
  - RULE-SET,direct,DIRECT
  - RULE-SET,direct_keyword,DIRECT
  # > 国内域名兜底
  - RULE-SET,cn_domain,DIRECT
  # ===== IP 规则 =====
  # > Apple 网段兜底（无域名的 QUIC 连接迁移路径，避免落到代理策略被阻断）
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - MATCH,Final

# ==================== 规则集提供者 ====================
rule-providers:
  ai:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/ai.mrs'
  ai_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/ai.list'
  telegram:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/telegram.mrs'
  stream:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/stream.mrs'
  direct:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/direct.mrs'
  stream_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/stream.list'
  direct_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/direct.list'
  telegram_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/telegram-ip.mrs'
  lan_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/lan-ip.mrs'
  direct_extra:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/direct-extra.mrs'
  cn_domain:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/cn-domain.mrs'
  china_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/china-ip.mrs'
# ==================== EOF ====================
