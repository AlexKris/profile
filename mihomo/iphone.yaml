# ==================== 锚点配置 ====================
BaseProvider: &BaseProvider
  type: http
  interval: 86400
  health-check:
    enable: true
    url: 'http://cp.cloudflare.com/generate_204'
    expected-status: 204
    interval: 300
    timeout: 5000
    lazy: true

BaseSelect: &BaseSelect {type: select, empty-fallback: PASS}
BaseProxySelect: &BaseProxySelect {type: select, empty-fallback: DIRECT}

FilterHK: &FilterHK '(?=.*(?:🇭🇰|香港|Hong|\bHK\b))'
FilterTW: &FilterTW '(?=.*(?:🇹🇼|台湾|台灣|Taiwan|\bTW\b))'
FilterJP: &FilterJP '(?=.*(?:🇯🇵|日本|Japan|\bJP\b))'
FilterUS: &FilterUS '(?=.*(?:🇺🇸|美国|United States|\bUSA?\b))'

FilterHKJPWide: &FilterHKJPWide '(?=.*(?:🇭🇰|🇯🇵|香港|日本|Hong|Japan|\bHK\b|\bJP\b))'
FilterGlobalMedia: &FilterGlobalMedia '(?=.*(?:🇭🇰|🇹🇼|🇸🇬|香港|台湾|台灣|新加坡|Hong|Taiwan|Singapore|\bHK\b|\bTW\b|\bSG\b))'
FilterGlobalEmby: &FilterGlobalEmby '(?=.*(?:🇭🇰|🇯🇵|🇸🇬|香港|日本|新加坡|Hong|Japan|Singapore|\bHK\b|\bJP\b|\bSG\b))'
FilterRFCEmby: &FilterRFCEmby '(?=.*(?:🇭🇰|🇯🇵|🇸🇬|香港|日本|新加坡|Hong|Japan|Singapore|\bHK\b|\bJP\b|\bSG\b))(?=.*(?:RFC|Jinx))'
FilterAIGC: &FilterAIGC '(?=.*(?:🇹🇼|🇯🇵|🇸🇬|🇺🇸|🇬🇧|台湾|台灣|日本|新加坡|美国|英国|Taiwan|Japan|Singapore|United States|\bTW\b|\bJP\b|\bSG\b|\bUSA?\b))(?=.*(?:SoftBank|Nuro|Ucom|IIJ|Starlink|ATT|Verizon|Frontier|Hawaii|家宽))'
FilterSpeedtest: &FilterSpeedtest '(?=.*(?:🇭🇰|🇹🇼|🇯🇵|🇸🇬|香港|台湾|台灣|日本|新加坡|Hong|Taiwan|Japan|Singapore|\bHK\b|\bTW\b|\bJP\b|\bSG\b))'

BehaviorCL: &BehaviorCL {type: http, behavior: classical, format: text, interval: 86400}

BehaviorMrsDN: &BehaviorMrsDN {type: http, behavior: domain, format: mrs, interval: 86400}

BehaviorMrsIP: &BehaviorMrsIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# ==================== 代理提供者 ====================
proxy-providers:
  sub:
    <<: *BaseProvider
    url: '订阅地址'
    path: ./proxy_providers/sub.yaml

# ==================== 核心配置 ====================
# FlClash 会用 App 设置覆盖本段的端口、allow-lan、find-process-mode、keep-alive、log-level、external-*，
# 以及 tun.stack、dns-hijack；PROCESS-NAME 规则需在 FlClash 里打开「查找进程」。
mode: rule
mixed-port: 7893
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 600

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: ''

profile: {store-selected: true, store-fake-ip: true}

# ==================== 流量嗅探 ====================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP: {ports: [80, 8080-8880]}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# ==================== TUN 模式 ====================
tun:
  enable: true
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  # auto-redirect: true  # 仅 Linux 支持，macOS 无效
  auto-detect-interface: true

# ==================== DNS 配置 ====================
dns:
  enable: true
  use-system-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.m2m"
    - injections.adguard.org
    - local.adguard.org
    - "+.bogon"
    - "+.local"
    - "+.lan"
    - "+.internal"
    - "+.localdomain"
    - "+.home.arpa"
    - 127.0.0.1.sslip.io
    - 127.atlas.skk.moe
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "*.turn.twilio.com"
    - "*.stun.twilio.com"
    - stun.syncthing.net
    - "stun.*"
    - "+.ea.com"
    - "+.eaassets-a.akamaihd.net"
    - "+.battle.net"
    - "+.battlenet.com"
    - "+.battlenet.com.cn"
    - "+.blizzard.com"
    - "+.blzstatic.cn"
    - "+.steamserver.net"
    - "+.steampowered.com"
    - "+.steamcontent.com"
    - "+.xboxlive.com"
    - stun.l.google.com
    - "+.mihoyo.com"
    - "+.yuanshen.com"
    - "+.bh3.com"
    - "+.bhsr.com"
    - "+.juequling.com"
    - "+.miyoushe.com"
    - "+.mhyurl.cn"
    - "+.hoyoverse.com"
    - "+.hoyolab.com"
    - "+.genshinimpact.com"
    - "+.honkaistarrail.com"
    - "+.honkaiimpact3.com"
    - "+.zenlesszonezero.com"
    - "+.kurogame.com"
    - "+.kurogames.com"
    - "+.kurobbs.com"
    - "+.aki-game.com"
    - "+.aki-game2.com"
    - "+.kurogames-global.com"
    - "+.kurogame.xyz"
    - "+.wegame.com.cn"
    - game.163.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
  default-nameserver: [119.29.29.29, 223.5.5.5]
  # 真实解析：局域网域名问系统 DNS，国内域名走阿里/腾讯，其余经 Proxy 问 Cloudflare
  nameserver-policy:
    '+.lan,+.local,+.internal,+.localdomain,+.home.arpa,+.miwifi.com': system
    'rule-set:direct_extra,apple,microsoft_cdn,direct,cn_domain': ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
  nameserver: ["https://1.1.1.1/dns-query#Proxy"]
  # DIRECT 拨号和节点域名用国内 DNS，避免依赖尚未建立的代理
  direct-nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
  proxy-server-nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]

# ==================== 代理策略组 ====================
proxy-groups:
  # ===== 顶层策略 =====
  - name: Proxy
    <<: *BaseProxySelect
    include-all: true

  # ===== 地区策略 =====
  - name: HK
    <<: *BaseSelect
    include-all: true
    filter: *FilterHK

  - name: TW
    <<: *BaseSelect
    include-all: true
    filter: *FilterTW

  - name: JP
    <<: *BaseSelect
    include-all: true
    filter: *FilterJP

  - name: US
    <<: *BaseSelect
    include-all: true
    filter: *FilterUS

  # ===== 专用策略 =====
  - name: Speedtest
    <<: *BaseSelect
    include-all: true
    filter: *FilterSpeedtest

  - name: AIGC
    <<: *BaseSelect
    include-all: true
    filter: *FilterAIGC

  - name: PayPal
    <<: *BaseSelect
    proxies: [US, HK, DIRECT]

  - name: GlobalMedia
    <<: *BaseSelect
    include-all: true
    filter: *FilterGlobalMedia

  - name: Telegram
    <<: *BaseSelect
    include-all: true
    filter: *FilterHKJPWide

  - name: MSCDN
    <<: *BaseSelect
    proxies: [DIRECT, Proxy]

  - name: Download
    <<: *BaseSelect
    include-all: true
    filter: *FilterHKJPWide

  - name: Google
    <<: *BaseSelect
    include-all: true
    filter: *FilterUS

  # ===== 手动策略 =====
  - name: GlobalEmby
    <<: *BaseSelect
    include-all: true
    filter: *FilterGlobalEmby

  - name: RFCEmby
    <<: *BaseSelect
    include-all: true
    filter: *FilterRFCEmby

  # ===== 兜底策略 =====
  - name: Final
    <<: *BaseSelect
    proxies: [Proxy, DIRECT]

# ==================== 规则路由 ====================
rules:
  # ===== 域名规则 start =====
  # > 自定义直连补充
  - RULE-SET,direct_extra,DIRECT
  # > 测速网站
  - RULE-SET,speedtest_domain,Speedtest
  # > AIGC
  - RULE-SET,ai,AIGC
  - RULE-SET,ai_keyword,AIGC
  # > PayPal
  - RULE-SET,paypal_rule,PayPal
  # > 流媒体（JP）
  - RULE-SET,stream_jp,JP
  # > 流媒体（TW）
  - RULE-SET,stream_tw,TW
  # > 流媒体（通用）
  - RULE-SET,stream,GlobalMedia
  - RULE-SET,stream_keyword,GlobalMedia
  # > Telegram 域名
  - RULE-SET,telegram,Telegram
  # > Apple
  - RULE-SET,apple_proxy,Proxy
  - RULE-SET,apple,DIRECT
  # > Microsoft CDN
  - RULE-SET,microsoft_cdn,MSCDN
  # > Download
  - RULE-SET,download_domain,Download
  - RULE-SET,download_nonip,Download
  - RULE-SET,download_classical,Download
  # > Google 服务
  - RULE-SET,google,Google
  # > 常见直连规则
  - RULE-SET,direct,DIRECT
  - RULE-SET,direct_keyword,DIRECT
  # > 国内域名兜底
  - RULE-SET,cn_domain,DIRECT
  # ===== 域名规则 end =====
  # ===== IP 规则 start =====
  # > LAN IP
  - RULE-SET,lan_ip,DIRECT,no-resolve
  # > Apple 网段兜底（无域名的 QUIC 连接迁移路径，避免落到代理策略被阻断）
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  # > Telegram IP
  - RULE-SET,telegram_ip,Telegram,no-resolve
  # > 中国大陆 IP
  - RULE-SET,china_ip,DIRECT,no-resolve
  # ===== IP 规则 end =====
  # > Final
  - MATCH,Final

