# Mihomo Configuration — Mini（精简版，全 select 策略组）

# ==================== 锚点配置 ====================
BaseProvider: &BaseProvider
  type: http
  interval: 86400
  proxy: Proxy
  health-check:
    enable: true
    url: 'http://cp.cloudflare.com/generate_204'
    expected-status: 204
    interval: 300
    timeout: 5000
    lazy: true

BaseSelect: &BaseSelect {type: select, empty-fallback: PASS}
BaseProxySelect: &BaseProxySelect {type: select, empty-fallback: DIRECT}

FilterHK: &FilterHK '(?=.*(?:🇭🇰|香港|Hong|\bHK\b))'
FilterTW: &FilterTW '(?=.*(?:🇹🇼|台湾|台灣|Taiwan|\bTW\b))'
FilterJP: &FilterJP '(?=.*(?:🇯🇵|日本|Japan|\bJP\b))'
FilterSG: &FilterSG '(?=.*(?:🇸🇬|新加坡|Singapore|\bSG\b))'
FilterUS: &FilterUS '(?=.*(?:🇺🇸|美国|United States|\bUSA?\b))'
FilterDE: &FilterDE '(?=.*(?:🇩🇪|德国|Germany|\bDEU?\b))'

FilterTelegram: &FilterTelegram '(?=.*(?:🇭🇰|🇯🇵|香港|日本|Hong|Japan|\bHK\b|\bJP\b))'
FilterGlobalMedia: &FilterGlobalMedia '(?=.*(?:🇭🇰|🇹🇼|🇸🇬|香港|台湾|台灣|新加坡|Hong|Taiwan|Singapore|\bHK\b|\bTW\b|\bSG\b))'
FilterAIGC: &FilterAIGC '(?=.*(?:🇹🇼|🇯🇵|🇸🇬|🇺🇸|🇬🇧|台湾|台灣|日本|新加坡|美国|英国|Taiwan|Japan|Singapore|United States|\bTW\b|\bJP\b|\bSG\b|\bUSA?\b))(?=.*(?:SoftBank|Nuro|Ucom|IIJ|Starlink|ATT|Verizon|Frontier|Hawaii|家宽))'

BehaviorCL: &BehaviorCL {type: http, behavior: classical, format: text, interval: 86400}

BehaviorMrsDN: &BehaviorMrsDN {type: http, behavior: domain, format: mrs, interval: 86400}

BehaviorMrsIP: &BehaviorMrsIP {type: http, behavior: ipcidr, format: mrs, interval: 86400}

# ==================== 代理提供者 ====================
proxy-providers:
  sub:
    <<: *BaseProvider
    url: '订阅地址'
    path: ./proxy_providers/sub.yaml

# ==================== 核心配置 ====================
mode: rule
port: 7890
socks-port: 7891
mixed-port: 7893
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: always
keep-alive-interval: 15
keep-alive-idle: 600

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: ''

profile: {store-selected: true, store-fake-ip: true}

# ==================== 流量嗅探 ====================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP: {ports: [80, 8080-8880]}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# ==================== TUN 模式 ====================
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-detect-interface: true

# ==================== DNS 配置（精简：fake-ip + 基础 nameserver）====================
dns:
  enable: true
  use-system-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.internal"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "stun.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver: [119.29.29.29, 223.5.5.5]
  nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]

# ==================== 代理策略组 ====================
proxy-groups:
  # ===== 顶层策略 =====
  - name: Proxy
    <<: *BaseProxySelect
    include-all: true

  # ===== 地区策略 =====
  - name: HK
    <<: *BaseSelect
    include-all: true
    filter: *FilterHK

  - name: TW
    <<: *BaseSelect
    include-all: true
    filter: *FilterTW

  - name: JP
    <<: *BaseSelect
    include-all: true
    filter: *FilterJP

  - name: SG
    <<: *BaseSelect
    include-all: true
    filter: *FilterSG

  - name: US
    <<: *BaseSelect
    include-all: true
    filter: *FilterUS

  - name: DE
    <<: *BaseSelect
    include-all: true
    filter: *FilterDE

  # ===== 专用策略 =====
  - name: AIGC
    <<: *BaseSelect
    include-all: true
    filter: *FilterAIGC

  - name: GlobalMedia
    <<: *BaseSelect
    include-all: true
    filter: *FilterGlobalMedia

  - name: Telegram
    <<: *BaseSelect
    include-all: true
    filter: *FilterTelegram

  # ===== 兜底策略 =====
  - name: Final
    <<: *BaseSelect
    proxies: [Proxy, DIRECT]

# ==================== 规则路由 ====================
rules:
  # ===== 域名规则 =====
  # > 自定义直连补充
  - RULE-SET,direct_extra,DIRECT
  # > AIGC
  - RULE-SET,ai,AIGC
  - RULE-SET,ai_keyword,AIGC
  # > 流媒体（通用）
  - RULE-SET,stream,GlobalMedia
  - RULE-SET,stream_keyword,GlobalMedia
  # > Telegram 域名
  - RULE-SET,telegram,Telegram
  # > 常见直连规则
  - RULE-SET,direct,DIRECT
  - RULE-SET,direct_keyword,DIRECT
  # > 国内域名兜底
  - RULE-SET,cn_domain,DIRECT
  # ===== IP 规则 =====
  # > LAN IP
  - RULE-SET,lan_ip,DIRECT,no-resolve
  # > Apple 网段兜底（无域名的 QUIC 连接迁移路径，避免落到代理策略被阻断）
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,china_ip,DIRECT,no-resolve
  - MATCH,Final

# ==================== 规则集提供者 ====================
rule-providers:
  # ===== 域名规则集 =====
  direct_extra:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/direct-extra.mrs'
  ai:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/ai.mrs'
  ai_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/ai.list'
  stream:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/stream.mrs'
  stream_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/stream.list'
  telegram:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/telegram.mrs'
  direct:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/direct.mrs'
  direct_keyword:
    <<: *BehaviorCL
    url: 'https://alexkris-rules.pages.dev/mihomo/classical/direct.list'
  cn_domain:
    <<: *BehaviorMrsDN
    url: 'https://alexkris-rules.pages.dev/mihomo/non-ip/cn-domain.mrs'

  # ===== IP 规则集 =====
  lan_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/lan-ip.mrs'
  telegram_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/telegram-ip.mrs'
  china_ip:
    <<: *BehaviorMrsIP
    url: 'https://alexkris-rules.pages.dev/mihomo/ip/china-ip.mrs'

# ==================== EOF ====================
